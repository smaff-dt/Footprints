<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop (responsive)</title>
<style>
body{margin:0;font-family:Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:#111;color:#fff}
.top a{color:#fff;margin-left:16px}
.top{position:sticky;top:0;z-index:5}
.hero{height:260px;min-height:45vh;background:#e8e2d6;display:flex;align-items:center;padding:0 40px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:24px 40px;max-width:1200px;margin:0 auto}
@media (max-width:1300px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:1fr}.hero{height:70vh}}
.cookie{position:fixed;left:0;right:0;bottom:0;padding:18px 40px;background:#2F4BD8;color:#fff;z-index:9}
.prod{border:1px solid #ddd;border-radius:8px;padding:12px;height:220px}
.foot{padding:30px 40px;background:#222;color:#ccc;margin-top:20px}
</style></head>
<body>
<div id="__next">
  <div class="top"><span>Astroshop</span><div><a href="#">Cart</a><a href="#">Account</a><i id="marker2" style="display:inline-block;width:30px;height:20px;margin-left:16px;background:#0000ff;color:#0000ff;font-style:normal">Blue</i></div></div>
  <main>
    <div class="hero"><div><h1>Telescopes for everyone</h1><button type="button">Shop now</button></div><span id="marker" style="display:block;margin-left:40px;width:120px;height:40px;background:#ff0000;color:#ff0000">Marker</span></div>
    <div><h2 style="padding:0 40px">Hot products</h2>
      <div class="grid">
        <div class="prod">Product 1<br><img id="pic1" src="green.png?eager" decoding="async" alt="" style="display:block;width:60px;height:40px;float:right"><button type="button">Add</button></div>
        <div class="prod">Product 2<br><button type="button">Add</button></div>
        <div class="prod">Product 3<br><button type="button">Add</button></div>
        <div class="prod">Product 4<br><button type="button">Add</button></div>
        <div class="prod">Product 5<br><button type="button">Add</button></div>
        <div class="prod">Product 6<br><button type="button">Add</button></div>
        <div class="prod">Product 7<br><button type="button">Add</button></div>
        <div class="prod">Product 8<br><button type="button">Add</button></div>
        <div class="prod">Product 9<br><button type="button">Add</button><img class="io-lazy" data-src="green.png?io" alt="Product 9" style="display:block;width:120px;height:80px;margin-top:8px;opacity:0;transition:opacity .6s"></div>
        <div class="prod">Product 10<br><button type="button">Add</button><img id="pic" src="green.png?lazy" loading="lazy" decoding="async" alt="Product 10" style="display:block;width:120px;height:80px;margin-top:8px"></div>
      </div>
    </div>
  </main>
  <div class="foot">© Astroshop · <a href="#">Privacy</a></div>
</div>
<div class="cookie">We use cookies <button type="button">OK</button></div>
<script>document.body.dataset.ua = navigator.userAgent.includes("iPhone") ? "phone" : "computer"</script>
<script>
// Pictures loaded by a script when they come into view, then faded in (common on shops).
const io = new IntersectionObserver((entries) => entries.forEach((e) => {
  if (!e.isIntersecting) return;
  const img = e.target; img.src = img.dataset.src; img.onload = () => (img.style.opacity = 1); io.unobserve(img);
}));
document.querySelectorAll(".io-lazy").forEach((i) => io.observe(i));
</script>
</body></html>
